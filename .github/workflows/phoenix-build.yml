# Phoenix custom Headwind launcher — CI build.
# Step 1 (this file): prove the stock source compiles in CI on the pinned toolchain.
# The Phoenix patches (factory-reset restriction, clean status bar, hidden MDM icons) and APK signing
# are added on top once this is green.
name: phoenix-build
on:
  push:
    branches: [master, "phoenix/**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships the Android SDK pre-installed (ANDROID_SDK_ROOT set, licences accepted).
      # setup-android@v3 fails trying to fetch the deprecated 'tools' package, so we use the built-in SDK.
      - name: Show Android SDK
        run: echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"; ls "$ANDROID_SDK_ROOT/platforms" || true
      - name: Assemble opensource release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOpensourceRelease --no-daemon --stacktrace
      - name: Show APK output
        run: find app/build/outputs/apk -name '*.apk' -print -exec ls -la {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-launcher-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
